tenant:
  domain: mock.local

users:
  - id: andrii
    displayName: Andrii Bezpalko
    upn: andrii@mock.local
  - id: oleh
    displayName: Oleh Pona
    upn: oleh@mock.local
  - id: taras
    displayName: Taras Ivaniuk
    upn: taras@mock.local
  - id: vasyl
    displayName: Vasyl Khrustiuk
    upn: vasyl@mock.local
  - id: zaharii
    displayName: Zaharii Abramchuk
    upn: zaharii@mock.local

groups:
  - id: test-engineering
    displayName: Test_Engineering
    members: [user:andrii, user:taras]
  - id: test-hr
    displayName: Test_HR
    members: [user:vasyl]
  - id: test-management
    displayName: Test_Management
    members: [user:oleh, user:andrii]

sites:
  - id: kb
    displayName: Knowledge Base
    drives:
      - id: kb-docs
        name: Documents
        items:
          - path: /General
            permissions:
              - { principal: group:test-engineering, role: read }
              - { principal: group:test-hr, role: read }
              - { principal: group:test-management, role: read }
          - path: /General/[General] Q3 2026 Company Holiday Policy.pdf
            source: "[General] Q3 2026 Company Holiday Policy.pdf"
          - path: /General/[General] Q3 2026 Company Holiday Policy-2 (Updated).pdf
            source: "[General] Q3 2026 Company Holiday Policy-2 (Updated).pdf"
          - path: /General/[General] Sick Leave FAQ (Conflict).txt
            content: |
              FAQ: Sick Leave Compensation
              Standard sick leave is compensated at 50% of the base salary.

          - path: /HR
            breakInheritance: true
            permissions:
              - { principal: group:test-hr, role: read }
              - { principal: group:test-management, role: read }
          - path: /HR/[HR] 2026 Sick Leave and Compensation Guide.txt
            content: |
              # Comprehensive Sick Leave Guide 2026
              Standard Compensation Rate: Standard short-term sick leave is compensated at 70% of base salary.
          - path: /HR/[Policy A] Remote Work Hardware Allowance (Old).txt
            content: |
              Policy A: Remote Work Hardware Allowance
              The annual allowance is $500. Ergonomic chairs are fully covered by this allowance.
          - path: /HR/[Policy B] Remote Work Hardware Allowance (New).txt
            content: |
              Policy B: Remote Work Hardware Allowance (Update)
              Effective immediately, the annual allowance is reduced to $300. 
              Ergonomic chairs are NO LONGER covered.

          - path: /Engineering
            breakInheritance: true
            permissions:
              - { principal: group:test-engineering, role: read }
              - { principal: group:test-management, role: read }
          - path: /Engineering/[Eng] Backend Deployment Pipeline Architecture.pdf
            source: "[Eng] Backend Deployment Pipeline Architecture.pdf"
