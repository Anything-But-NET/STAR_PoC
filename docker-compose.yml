version: "3.8"

services:
  mock-graph:
    image: ghcr.io/sergey-shulyak/mock-graph-server:latest
    container_name: mock-graph
    ports:
      - "8080:8080"
    environment:
      - MOCKGRAPH__FIXTUREPATH=/app/fixtures/fixture.yaml
    volumes:
      - ./fixtures:/app/fixtures:ro

  db:
    image: pgvector/pgvector:pg18-trixie
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql

volumes:
  pg_data: